server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Same policy as the <meta> tag in index.html, plus the parts only a header can carry (frame-ancestors).
    # If the API moves off localhost:5098, change connect-src here AND in src/index.html.
    # These are set once at server level; the locations below deliberately use "expires" (not add_header)
    # for caching, because any add_header inside a location would switch these off for that location.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:5098 ws://localhost:5098; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Built files have a hash in their name, so they can be cached for a long time.
    location ~* \.(js|css|ico)$ {
        expires 1y;
    }

    # Angular routes: unknown paths fall back to the app, which is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
