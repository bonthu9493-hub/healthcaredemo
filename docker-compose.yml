# One command starts everything:   docker compose up --build
# Secrets are read from a local, git-ignored ".env" file (copy ".env.example" and fill it in).
name: hospital

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    # No "ports:" on purpose: the database is reachable only from the api container, never from your machine or the network.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  api:
    build: ./api
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=sql;Database=HospitalDb;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (32+ random characters)}
      Jwt__Issuer: hospital-api
      Jwt__Audience: hospital-web
      Cors__Origins: http://localhost:4200
      AllowedHosts: localhost
      Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports:
      - "5098:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build: ./web
    depends_on: [api]
    ports:
      - "4200:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  sqldata:
