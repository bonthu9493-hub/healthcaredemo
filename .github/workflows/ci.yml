name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the pipeline can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tests run against a real SQL Server. It is thrown away after the job,
      # and its password is generated here, so no database secret lives in the repository.
      - name: Start a throwaway SQL Server
        run: |
          PASSWORD="Aa1$(openssl rand -hex 12)"
          echo "::add-mask::$PASSWORD"
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest
          echo "TEST_SQL_CONNECTION=Server=localhost,1433;User Id=sa;Password=$PASSWORD;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs sql
          echo "SQL Server did not become ready" && exit 1

      - run: dotnet restore HospitalManagement.slnx
      - run: dotnet build HospitalManagement.slnx --no-restore -c Release

      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet list HospitalManagement.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "Vulnerable packages found"; exit 1; fi

      - name: Test
        run: dotnet test HospitalManagement.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

      - name: Fail on known vulnerabilities (high or worse)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - name: Scan for committed secrets
        # "safe.directory": the repo is owned by the runner user, and git inside the container refuses to read it otherwise.
        # Findings are printed redacted, so a failure explains itself without leaking the value.
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh zricethezav/gitleaks:v8.18.4 -c \
            'git config --global --add safe.directory /repo && gitleaks detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact --verbose'

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hospital-api ./api
      - run: docker build -t hospital-web ./web
